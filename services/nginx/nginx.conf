worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server localhost:3001;  # Adjust port to match your auth service
    }

;     upstream post_service {
;         server localhost:8001;  # Adjust port to match your post service
;     }
;
;     upstream comment_service {
;         server localhost:8002;  # Adjust port to match your comment service
;     }

    upstream frontend {
        server localhost:3000;  # Adjust if your React app runs on different port
    }

    server {
        listen 80;
        server_name localhost;

        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/posts/ {
            proxy_pass http://post_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/comments/ {
            proxy_pass http://comment_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}